<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden;background:#050506}
  .card{position:relative;width:1200px;height:630px;overflow:hidden;
    background:
      radial-gradient(760px 320px at 50% 92%, rgba(168,130,60,.20) 0%, rgba(168,130,60,.05) 45%, transparent 72%),
      radial-gradient(1080px 760px at 50% 38%, #1c1c22 0%, #0d0d11 48%, #050506 100%);
    font-family:'Inter','Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;color:#f4f4f6;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:62px}

  /* 斜めの光（レンズを横切る光。映像の会社らしさ） */
  .sweep{position:absolute;left:-30%;top:-60%;width:70%;height:220%;transform:rotate(18deg);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.045) 45%,rgba(255,255,255,.075) 50%,rgba(255,255,255,.03) 56%,transparent);
    filter:blur(26px)}
  /* フィルムの粒子 */
  .grain{position:absolute;inset:0;opacity:.16;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='220' height='220' filter='url(%23n)' opacity='0.55'/></svg>")}
  /* 四隅の落ち込み */
  .vig{position:absolute;inset:0;background:radial-gradient(760px 520px at 50% 46%,transparent 42%,rgba(0,0,0,.62) 100%)}

  /* シネマの上下の線 */
  .bar{position:absolute;left:96px;right:96px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(168,130,60,.55) 22%,rgba(168,130,60,.55) 78%,transparent)}
  .bar.t{top:58px}
  .bar.b{bottom:58px}

  .stack{position:relative;display:flex;flex-direction:column;align-items:center}
  .eyebrow{font-size:15px;font-weight:500;letter-spacing:.44em;color:#c9a75f;text-transform:uppercase;
    margin-bottom:34px;padding-left:.44em}
  .logo{width:392px;filter:drop-shadow(0 6px 34px rgba(0,0,0,.75))}
  .rule{width:56px;height:2px;background:linear-gradient(90deg,#8a6a2d,#d8b76a,#8a6a2d);margin:32px 0 30px}
  h1{font-family:'Noto Serif JP','Hiragino Mincho ProN',serif;font-size:50px;font-weight:600;line-height:1.32;
    letter-spacing:.03em;text-align:center;color:#ffffff;text-shadow:0 4px 30px rgba(0,0,0,.8)}
  .caption{font-size:21px;font-weight:400;letter-spacing:.10em;color:#b9b9c2;padding-left:.10em;margin-top:26px}
  .site{position:absolute;bottom:74px;left:0;right:0;text-align:center;
    font-size:15px;font-weight:400;letter-spacing:.26em;color:#8b8b95;padding-left:.26em}

  /* フレームの四隅 */
  .tick{position:absolute;width:26px;height:26px;border:1px solid rgba(168,130,60,.45)}
  .tl{left:96px;top:58px;border-right:0;border-bottom:0}
  .tr{right:96px;top:58px;border-left:0;border-bottom:0}
  .bl{left:96px;bottom:58px;border-right:0;border-top:0}
  .br{right:96px;bottom:58px;border-left:0;border-top:0}
</style></head>
<body>
<div class="card">
  <div class="sweep"></div>
  <div class="vig"></div>
  <div class="bar t"></div><div class="bar b"></div>
  <div class="tick tl"></div><div class="tick tr"></div><div class="tick bl"></div><div class="tick br"></div>

  <div class="stack">
    <div class="eyebrow">Film &amp; Motion</div>
    <img class="logo" src="../../public/core-studio-logo-white.png" alt="CORE Studio">
    <div class="rule"></div>
    <h1>撮影せずに、<br>広告に出せる映像を。</h1>
    <div class="caption">企画・脚本・ディレクション・仕上げまで、一貫制作。</div>
  </div>
  <div class="site">studio.core-ai.jp</div>
  <div class="grain"></div>
</div>
</body></html>
