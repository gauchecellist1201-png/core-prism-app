<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/core-192-v2.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/core-180-v2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08090C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sales OS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- オーナー専用の社内画面。検索には出さない -->
    <meta name="robots" content="noindex, nofollow" />
    <title>CORE Studio Sales OS</title>
    <style>
      html, body { margin: 0; padding: 0; background: #08090C; }
      body {
        color: #F5F7FA;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
        /* 横に伸びる要素があっても、ページ全体が横スクロールしないようにする */
        overflow-x: hidden;
      }
      * { -webkit-tap-highlight-color: rgba(216,168,59,0.18); }
      button, input, textarea, select { font-family: inherit; }
      /* 単色の輪だと金色のボタンの上で消える。内外2色にして必ずどちらかが見える */
      :focus-visible {
        outline: 2px solid #0B0A06;
        outline-offset: 0;
        box-shadow: 0 0 0 4px #D8A83B;
        border-radius: 8px;
      }
      @keyframes salesspin { to { transform: rotate(360deg); } }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: #242A36; border-radius: 999px; }
      ::-webkit-scrollbar-track { background: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/sales/main.tsx"></script>
  </body>
</html>
